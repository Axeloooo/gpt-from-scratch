[project]
name = "gpt-from-scratch"
version = "0.0.0"
description = "A GPT built from scratch, then scaled to a GPT-2 124M reproduction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt_from_scratch = ["input.txt"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
disallow_untyped_calls = false  # torch's Tensor.backward is untyped
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
